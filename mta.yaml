_schema-version: "3.2"
ID: etm
version: 0.0.1
modules:
- name: etm-destination-content
  type: com.sap.application.content
  requires:
  - name: etm-destination-service
    parameters:
      content-target: true
  - name: etm_html_repo_host
    parameters:
      service-key:
        name: etm_html_repo_host-key
  - name: uaa_etm
    parameters:
      service-key:
        name: uaa_etm-key
  parameters:
    content:
      subaccount:
        destinations:
        - Name: etm_etm_html_repo_host
          ServiceInstanceName: etm-html5-app-host-service
          ServiceKeyName: etm_html_repo_host-key
          sap.cloud.service: etm
        - Authentication: OAuth2UserTokenExchange
          Name: etm_uaa_etm
          ServiceInstanceName: etm-xsuaa-service
          ServiceKeyName: uaa_etm-key
          sap.cloud.service: etm
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: etm-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: etm_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - appworkflowuimodule.zip
      name: appworkflowuimodule
      target-path: resources/
- name: appworkflowuimodule
  type: html5
  path: workflow-ui-module
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: etm-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        subaccount:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: etm-destination-service
    service-plan: lite
- name: etm_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: etm-html5-app-host-service
    service-plan: app-host
- name: uaa_etm
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: etm-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
